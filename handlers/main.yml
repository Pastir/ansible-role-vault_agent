---
# Templates are re-rendered on start; a template command runs only if its output changed.
- name: Restart vault agent
  ansible.builtin.systemd_service:
    name: "{{ vault_agent_service }}"
    state: restarted
    daemon_reload: true
  # A package change notifies this before the unit exists (e.g. only install.yml was used).
  when: __vault_agent_unit_present | default(false)
